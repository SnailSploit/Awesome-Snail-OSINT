name: Publish tested research combinations
on:
  push:
    branches: [main]
    paths:
      - .github/research-stage/**
      - .github/workflows/research-upgrade.yml
permissions:
  contents: read
concurrency:
  group: atlas-research-publication
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'SnailSploit/Awesome-Snail-OSINT'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed source bundles with original-blob leases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import pathlib, json, lzma, hashlib, subprocess, shutil
          allowed = ('site/', 'server/', 'functions/', 'tests/', 'scripts/', 'docs/', 'examples/')
          def apply(directory, expected_hash):
              pieces=sorted(pathlib.Path(directory).glob('part-*.xz'), key=lambda p:int(p.stem.split('-')[-1]))
              packed=b''.join(p.read_bytes() for p in pieces)
              assert hashlib.sha256(packed).hexdigest()==expected_hash, 'Bundle integrity mismatch'
              manifest=json.loads(lzma.decompress(packed))
              for name, expected in manifest['expected'].items():
                  p=pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert name.startswith(allowed) or name in ('README.md','ATLAS.md','.github/workflows/atlas.yml')
                  if expected is None:
                      assert not p.exists(), 'Unexpected new file: '+name
                  else:
                      assert p.is_file() and not p.is_symlink(), 'Missing original file: '+name
                      raw=p.read_bytes();actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                      assert actual==expected, 'Original blob changed: '+name
              subprocess.run(['git','apply','--check','-'],input=manifest['patch'].encode(),check=True)
              subprocess.run(['git','apply','-'],input=manifest['patch'].encode(),check=True)
              for name,content in manifest['files'].items():
                  assert name in manifest['expected'] and manifest['expected'][name] is None
                  p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
          apply('.github/execution-stage','cf14499e2f42123de9c5d6c7556250cdcec5c9a734a5f5dcb99b8a567005b177')
          apply('.github/research-stage','4b6f4017d69693c7370fd0a13abe85ce42cfc1d6ea5a14ab2466edd3f13ffd53')
          for directory in ('.github/execution-stage','.github/research-stage'):shutil.rmtree(directory)
          for name in ('execution-upgrade.yml','research-upgrade.yml','research-source-snapshot.yml'):
              pathlib.Path('.github/workflows',name).unlink(missing_ok=True)
          PY
          git add -A
          git diff --cached --check
          git write-tree > /tmp/research-tested-tree
          git diff --cached --stat
      - name: Build and run documentation, Python and JavaScript checks
        run: |
          python3 -m pip install pypdf==5.9.0
          python3 scripts/check_docs.py
          python3 scripts/build_atlas.py
          python3 -m unittest discover -s tests -v
          node --check site/app.mjs
          node --check site/synthesis.mjs
          node --test tests/*.test.mjs
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Validate the original Atlas, executable runner and synthesis workspace
        run: |
          python3 scripts/browser_smoke.py
          python3 scripts/execution_browser_smoke.py
          python3 scripts/synthesis_browser_smoke.py
      - name: Verify real Digital Asset Links collection without fixture fallback
        run: |
          node --input-type=module - <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {collectApps} from './server/synthesis.mjs';
          import {analyze} from './site/synthesis-core.mjs';
          const input=await collectApps(['www.google.com','google.com']);
          const report=await analyze(input);
          await writeFile('.browser-test/synthesis-provider-canary.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({mode:'real-provider-canary-not-novelty-evidence',observations:report.observations.map(r=>({subject:r.subject,outcome:r.outcome,error:r.payload.error})),findings:report.findings.length}));
          if(!report.observations.some(r=>r.outcome==='ok'))throw Error('No real provider declarations returned. Do not publish a fake live collector.');
          JS
      - name: Publish only the tested tree to unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test "$(git write-tree)" = "$(cat /tmp/research-tested-tree)"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: executable research synthesis, evidence collectors and adversarial validation'
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git config --local http.https://github.com/.extraheader "$header"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'MAIN_COMMIT=%s\nTESTED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git write-tree)" | tee .browser-test/published-research.txt
          git archive --format=tar.gz --output=/tmp/research-implemented-source.tar.gz HEAD
          printf '## Executable synthesis published\n\nCommit: `%s`\n\nAll three browser suites and real-provider collection passed before publication. Synthetic challenge tests do not establish real-world novelty or precision.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve browser and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-implementation-evidence
          path: |
            .browser-test/
            /tmp/research-implemented-source.tar.gz
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
