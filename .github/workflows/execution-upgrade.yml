name: Validate and publish executable Atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/execution-upgrade.yml
      - .github/execution-stage/**
permissions:
  contents: read
concurrency:
  group: atlas-execution-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.repository == 'SnailSploit/Awesome-Snail-OSINT' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the reviewed package only to its exact source versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma, subprocess
          root=Path.cwd()
          package=b''.join((root/'.github/execution-stage'/f'part-{n}.xz').read_bytes() for n in range(5))
          assert hashlib.sha256(package).hexdigest()=='cf14499e2f42123de9c5d6c7556250cdcec5c9a734a5f5dcb99b8a567005b177', 'Package integrity mismatch'
          manifest=json.loads(lzma.decompress(package))
          allowed=('site/','server/','functions/api/','tests/','scripts/','docs/','.github/workflows/atlas.yml')
          for name,expected in manifest['expected'].items():
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts and name.startswith(allowed)
              if expected is None:
                  assert not path.exists(), 'Unexpected existing path: '+name
              else:
                  actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
                  assert actual==expected, 'Concurrent source change: '+name
          patch=manifest['patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,content in manifest['files'].items():
              assert name in manifest['expected'] and manifest['expected'][name] is None
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          readme=Path('README.md');original=readme.read_text()
          marker='## The investigation atlas\n'
          assert original.count(marker)==1
          block='''## Live investigations

          **[Run a real investigation](https://snail-osint-atlas.pages.dev/#view=run)** - three bounded public-record workflows, not a diagram or simulated results.

          - **Domain footprint:** DNS records, registry registration data, and routing context for up to two observed public IP addresses.
          - **Mail DNS evidence:** MX, TXT and the exact-domain DMARC record; this is not a full mail-delivery or policy-compliance audit.
          - **IP context:** public allocation records and the covering route/origin ASNs reported by RIPEstat.

          Results stream into a provenance-linked graph and observation inspector. Export actual evidence as JSON or Markdown, optionally save a browser-local snapshot, and reload it without rerunning queries. Failed and unsupported lookups remain explicit; hashes are unsigned integrity checks, not proof of authenticity.

          Nothing executes until you enter a target and confirm scope. This adds three runnable workflows; the ten authored research playbooks and hundreds of catalog resources are not automatically executable adapters. [Implementation, limits and local setup](docs/execution.md).

          '''
          readme.write_text(original.replace(marker,block+marker,1))
          atlas=Path('ATLAS.md');text=atlas.read_text()
          text=text.replace('## Run locally\n','## Executable investigations\n\nThe [live runner](https://snail-osint-atlas.pages.dev/#view=run) now executes three bounded public-record workflows and builds a graph from captured observations. See [execution documentation](docs/execution.md) for provider scope, provenance, persistence and rate-limit boundaries. The ten authored playbooks remain manual references.\n\n## Run locally\n',1)
          text=text.replace('Requires Python 3.10 or newer.','Requires Python 3.10 or newer and Node 22 for the local API server.')
          text=text.replace('python3 -m http.server 8080 --directory _site','node scripts/serve_atlas.mjs')
          text=text.replace('node --test tests/core.test.mjs','node --test tests/*.test.mjs')
          text=text.replace('No target lookup is performed automatically.','No target lookup is performed on page load. The live runner sends explicitly confirmed inputs to its listed public-data providers; the original query generator remains local.')
          text=text.replace('These are manually authored playbooks, not an autonomous investigation agent, a graph of discovered real-world relationships, or an AI-generated evidence engine.','The ten reference playbooks are manually authored. Separately, the live runner collects DNS, registration and routing records and renders only evidence-backed relationships. Neither surface is an autonomous or AI-generated evidence engine.')
          text=text.replace('host above. All assets use relative URLs, so project subpaths are supported.','host above. GitHub Pages serves only the static directory; executable workflows require the same-origin API provided by Cloudflare Pages Functions or the local Node server.')
          atlas.write_text(text)
          Path('/tmp/atlas-upgrade-paths.json').write_text(json.dumps(list(manifest['expected'])+['README.md','ATLAS.md']))
          print('Applied',len(manifest['expected']),'reviewed source paths; preserved existing directory content.')
          PY
      - name: Validate documentation, catalog, and regression suites
        run: |
          python3 scripts/check_docs.py
          python3 scripts/build_atlas.py
          python3 -m unittest discover -s tests -v
          node --check site/app.mjs
          node --check site/investigate.mjs
          node --test tests/*.test.mjs
      - name: Install Chromium test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Test the preserved directory over real HTTP
        run: python3 scripts/browser_smoke.py
      - name: Test streamed execution, evidence, persistence, exports and mobile layouts
        run: python3 scripts/execution_browser_smoke.py
      - name: Publish only the tested files to unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, subprocess, shutil
          from pathlib import Path
          paths=json.loads(Path('/tmp/atlas-upgrade-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          shutil.rmtree('.github/execution-stage')
          Path('.github/workflows/execution-upgrade.yml').unlink()
          subprocess.run(['git','add','-u','--','.github/execution-stage','.github/workflows/execution-upgrade.yml'],check=True)
          PY
          git diff --cached --check
          git diff --exit-code
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: execute bounded OSINT investigations with provenance-linked graphs and evidence exports'
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git config --local http.https://github.com/.extraheader "$header"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git push origin HEAD:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'COMMIT=%s\nTREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee .browser-test/publication.txt
          printf '## Published tested execution upgrade\n\nCommit: `%s`\n\nTests use real local HTTP with deterministic fixture upstreams, not live provider certification.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-execution-upgrade-validation
          path: .browser-test/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
